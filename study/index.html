<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPR 학습 프로그램</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="main-header">
            <h1>📖 CPR 학습 프로그램</h1>
            <p>시나리오 기반 역할 학습 및 절차 숙달</p>
        </header>

        <!-- 학습 설정 화면 -->
        <div id="learning-setup-screen" class="screen active">
            <div class="setup-card">
                <h2>학습 설정</h2>
                <div class="setup-form">
                    <div class="form-group">
                        <label for="scenario-select">학습할 시나리오 선택:</label>
                        <select id="scenario-select"></select>
                    </div>
                    <div class="form-group">
                        <label for="role-select">학습할 역할 선택:</label>
                        <select id="role-select"></select>
                    </div>
                    <button id="start-learning" class="btn btn-primary">학습 시작</button>
                </div>
            </div>
        </div>

        <!-- 학습 진행 화면 -->
        <div id="learning-screen" class="screen">
           <div class="presentation-header">
               <div class="header-left">
                   <h1 id="learning-role-title">선택한 역할</h1>
                   <p id="learning-scenario-title">선택한 시나리오</p>
               </div>
               <div class="scenario-details-pres">
                    <div class="detail-item"><strong>환자 상태:</strong> <span id="patient-condition-pres"></span></div>
                    <div class="detail-item"><strong>환경:</strong> <span id="environment-pres"></span></div>
                    <div class="detail-item"><strong>조건:</strong> <span id="scenario-description-pres"></span></div>
               </div>
               <div class="header-right">
                   <div class="timer-pres">
                       <span>경과 시간</span>
                       <span id="time-elapsed-pres">00:00</span>
                   </div>
               </div>
           </div>

           <div class="learning-content">
               <div id="role-checklist-container" class="role-checklist-card">
                   <!-- 학습용 체크리스트가 여기에 표시됩니다. -->
               </div>
               <div id="step-guide-container" class="step-guide-card">
                    <h3>단계별 상세 가이드</h3>
                    <div id="step-guide-content">
                        <p>체크리스트 항목을 클릭하면 여기에 상세한 설명이 표시됩니다.</p>
                    </div>
               </div>
           </div>

           <div class="presentation-footer">
                <button id="back-to-setup" class="btn btn-secondary btn-large">설정으로 돌아가기</button>
           </div>
        </div>
    </div>

    <audio id="bg-audio" loop></audio>
    <audio id="sfx-audio"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
